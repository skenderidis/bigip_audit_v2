server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Graph image uploads are capped at 4 MB each in the backend; leave headroom.
    client_max_body_size 8m;

    # gzip the static bundle
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + health → backend service. "backend" is the compose service name.
    location /api/ {
        proxy_pass         http://backend:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # QKView pulls and report generation can take a while.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://backend:8002/health;
    }

    # SPA: every unknown path falls back to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
